[workspace]
resolver = "2"
members = ["crates/*"]
# Real third-party crates vendored as git submodules under `corpus/` are test
# fixtures (fast-tier smoke in the default suite; a scheduled full-tier
# subset run). Excluded so cargo treats each as its own standalone package —
# otherwise cargo would try to fold them into this workspace and error.
# `extractor` is the nightly rustc_private lint dylib (its own toolchain pin,
# own lockfile).
exclude = ["corpus", "extractor"]

[workspace.package]
rust-version = "1.88"

[workspace.dependencies]
# Bin deps
# Terminal styling for the `explain` / `check --help` doc renderer. Already in
# the tree via clap (anstream wraps clap's help), so declaring them direct adds
# no crates; `anstream::AutoStream::choice` reuses the same NO_COLOR / tty
# detection clap uses, keeping the doc's color in step with clap's own help.
anstream = "1"
anstyle = "1"
anyhow = "1"
cargo_metadata = "0.23"
clap = { version = "4", features = ["derive"] }
# The dylint orchestrator library (no rustc_private — the binary stays stable).
# `library_packages` pulls in the cargo-cli plumbing `run()` needs to build the
# driver and invoke `cargo check`. Version-locked to the pin in
# extractor/rust-toolchain.toml — bump both together (SPIKE §12.4).
dylint = { version = "6.0.1", features = ["library_packages"] }
# The fixed-seed fast hasher backing the semantic join's hot lookup maps
# (keyed on DefPathHash / display path) — replaces BTreeMap<String> string
# compares over ~100k defs on the ~1.65M-edge fold. `FixedState` ⇒ reproducible.
foldhash = "0.1"
fs-err = "3"
globset = "0.4"
ignore = "0.4"
# Insertion-ordered def index for the semantic assembly: O(1) fast-hash lookup
# with deterministic iteration order (the derived guard indexes depend on it).
indexmap = "2"
# Zero-copy mmap of the rkyv IR fragments (already a transitive dep via tokei).
memmap2 = "0.9"
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
# Data-parallelism for the semantic tier: the per-config assemblies are
# independent, so they build concurrently (one rayon task per `[engine] config`).
rayon = "1"
regex = "1"
# The on-disk IR fragment transport (see wl-ir). Concrete-pinned in wl-ir itself
# (self-contained crate); inherited here by wl-engine.
rkyv = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shell-words = "1"
strip-ansi-escapes = "0.2"
syn = { version = "2", features = ["extra-traits", "full", "visit"] }
thiserror = "2"
tokei = { version = "14", default-features = false }
toml = "1"
toml_edit = "0.25"

# Dev-deps
assert_cmd = "2"
cargo-husky = { version = "1", default-features = false, features = ["user-hooks"] }
insta = "1"
predicates = "3"
tempfile = "3"

# Optimize the semantic tier's hot path even in dev builds. The join reads its
# IR fragments as rkyv **archived** types (rel-ptr chasing, `ArchivedString::as_str`,
# `ArchivedVec` iteration, `wl_ir::join_paths`); those accessors are tiny and rely
# on inlining, so at `opt-level = 0` the cross-crate join runs ~5× slower on large
# workspaces (the debug `cargo run` path the dogfood/CI use — negligible on small
# ones). Optimizing only the three crates the archived loop spans keeps every other
# crate's incremental dev build fast. rkyv compiles once; wl-ir is tiny; wl-engine
# is the one with a modest dev-rebuild cost, worth it for the ~5× join speedup.
[profile.dev.package.rkyv]
opt-level = 2
[profile.dev.package.wl-ir]
opt-level = 2
[profile.dev.package.wl-engine]
opt-level = 2

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
