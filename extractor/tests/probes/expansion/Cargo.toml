# Purpose-built probe for the macro-expansion span policy (SPIKE §12.7, WS1).
# A *lint target*, not a workspace member: it has its own empty `[workspace]`
# table so the extractor (dylint → driver) compiles it in isolation, exactly
# like a real downstream crate. The dangerous case it exercises: an item whose
# `pub` token lives in a *different* file (a cross-file `macro_rules!`), which
# must never become a `--fix` write surface. Assertions live in
# `extractor/tests/probe.rs` (the golden-spine tier-1 test).
[package]
name = "probe-expansion"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
# Re-export-shim stub for the `via` probe (§16) — see ../shim/Cargo.toml.
shim = { package = "probe-shim", path = "../shim" }
# Token-passthrough bang-macro dep (the cfg_if shape) — see
# ../passthrough/Cargo.toml. Consumed ONLY via its macro, so the reference
# graph must record no edge to it while `used_crates` still names it
# (probe.rs check 24).
passthrough = { package = "probe-passthrough", path = "../passthrough" }

[build-dependencies]
# Build-script-extraction stub (§17) — see ../buildstub/Cargo.toml.
buildstub = { package = "probe-buildstub", path = "../buildstub" }

# Harness-less integration test (the criterion/datatest shape): cargo builds
# it under `--tests` but does NOT pass `--test` to rustc, so `sess.opts.test`
# is false — the fragment must still be keyed `custom_harness+test.wlir` (the
# completeness guard expects every test-kind target as `+test`; keying the
# suffix on `opts.test` alone bricked such workspaces). Asserted in probe.rs
# check 22.
[[test]]
name = "custom_harness"
harness = false

[workspace]
