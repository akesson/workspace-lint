# Detached committed tool — its own [workspace] table keeps it OUT of the parent
# workspace (members = ["crates/*"]), so its heavy deps (scip/protobuf) never
# touch the published crates, dogfood, or the fast test path. Run on demand:
#   cargo run --manifest-path tools/oracle-bless/Cargo.toml
[package]
name = "oracle-bless"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
syn-workspace = { path = "../../crates/syn-workspace" }
scip = "0.7"
# Needed for the `protobuf::Message` trait to decode the SCIP index. Kept open
# (^3) so it tracks whatever protobuf `scip` itself pins, rather than a hard
# `=` that would conflict on a future `scip` bump.
protobuf = "3"
serde_json = "1"
anyhow = "1"
