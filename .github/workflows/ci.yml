name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  checks:
    name: Checks (fmt, typos, audit, clippy, doc, publish)
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2.86.7
        with:
          tool: cargo-audit
      - name: Format
        run: cargo fmt --all --check
      - name: Typos
        uses: crate-ci/typos@v1
      - name: Audit
        run: cargo audit
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Docs
        run: cargo doc --workspace --no-deps --locked
      - name: Publish dry-run (publishable libs)
        run: cargo publish --dry-run -p workspace-lint-marker --allow-dirty

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Submodules: the corpus fast-tier smoke (tests/corpus.rs) runs the
      # build-free lints over every vendored corpus crate — sources only, no
      # compile, no network. (The full-tier corpus run is the scheduled
      # `corpus` workflow.) The smoke skips cleanly where submodules are
      # absent, so a checkout without them just loses that coverage.
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      # The full tier is live: `unused-deps` runs on the rustc engine, so the
      # dogfood test and the unused-deps case fixtures extract IR during the
      # suite. That needs the pinned nightly (+ rustc-dev), dylint-link, and —
      # cached, because it's the slowest cold step — dylint's per-toolchain
      # driver. Keep the pin in lockstep with extractor/rust-toolchain.toml.
      - name: Install pinned nightly (+ rustc-dev) for the extraction engine
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-04-16
          components: rustc-dev, llvm-tools-preview
      # dtolnay/rust-toolchain sets the LAST installed toolchain as default;
      # the workspace builds on stable, so restore it explicitly.
      - name: Restore stable as default
        run: rustup default stable
        shell: bash
      # dylint-link has no prebuilt binaries — `cargo install` compiles it
      # from source every run (~1.3 min on the Windows runner). Cache the
      # binary on its pinned version; keep that pin in lockstep with the
      # `dylint` version in Cargo.lock.
      - name: Cache dylint-link
        id: cache-dylint-link
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/dylint-link*
          key: ${{ runner.os }}-dylint-link-6.0.1
      - name: Install dylint-link
        if: steps.cache-dylint-link.outputs.cache-hit != 'true'
        run: cargo install dylint-link --version 6.0.1 --locked
      - name: Cache dylint driver
        uses: actions/cache@v6
        with:
          path: ~/.dylint_drivers
          key: ${{ runner.os }}-dylint-driver-nightly-2026-04-16
      # The engine materializes the vendored extractor and builds its dylib
      # under ~/.cache/workspace-lint (`ExtractorSource::vendored`) — a path
      # neither rust-cache nor the driver cache covers, so every run paid a
      # from-scratch dylib build inside the warm step. A stale restore-key
      # hit is safe by design: materialization is content-compared and
      # self-healing, and cargo freshness rebuilds only what changed.
      - name: Cache vendored extractor build
        uses: actions/cache@v6
        with:
          path: ~/.cache/workspace-lint
          key: ${{ runner.os }}-wl-extractor-nightly-2026-04-16-${{ hashFiles('extractor/**', 'crates/wl-ir/**') }}
          restore-keys: ${{ runner.os }}-wl-extractor-nightly-2026-04-16-
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
      # Build the dylint driver + extractor dylib once, serially, before the
      # suite fans out: on a cold driver cache every concurrent test process
      # otherwise starts its own full driver build (dylint has no cross-process
      # lock — each builds in a tempdir and atomically renames), and N
      # simultaneous rustc-interface builds plus fixture compiles exhaust the
      # runner (observed as a SIGBUS in one extraction on ubuntu). Doubles as
      # the dogfood run.
      - name: Warm the extraction engine
        run: cargo run -q -p workspace-lint --locked
      - run: cargo nextest run --workspace --locked
      # Semantic-lint fixtures (architecture / unused-deps / unused-pub) must
      # `cargo check` offline: the rustc-driver engine those lints are being
      # ported onto compiles the analyzed workspace. Ubuntu-only — the gate is
      # about the fixtures' Rust source, not platform behavior — and after
      # nextest so the cargo cache already holds the root dependency tree the
      # fixtures draw their registry deps from.
      - name: Semantic fixture compile sweep
        if: matrix.os == 'ubuntu-latest'
        run: WL_FIXTURE_COMPILE=1 cargo test -p workspace-lint --test fixture_compile --locked -- --nocapture
      # nextest does not run doctests — exercise them so a broken doc
      # example can't ship.
      - name: Doctests
        run: cargo test --doc --workspace --locked

  crap:
    name: CRAP (coverage × complexity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      # Coverage runs the full suite, and the suite runs the full tier (dogfood
      # + unused-deps cases extract IR) — same provisioning as the test matrix.
      - name: Install pinned nightly (+ rustc-dev) for the extraction engine
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-04-16
          components: rustc-dev, llvm-tools-preview
      - name: Restore stable as default
        run: rustup default stable
      # Same cached provisioning as the test matrix (see the comments there).
      - name: Cache dylint-link
        id: cache-dylint-link
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/dylint-link*
          key: ${{ runner.os }}-dylint-link-6.0.1
      - name: Install dylint-link
        if: steps.cache-dylint-link.outputs.cache-hit != 'true'
        run: cargo install dylint-link --version 6.0.1 --locked
      - name: Cache dylint driver
        uses: actions/cache@v6
        with:
          path: ~/.dylint_drivers
          key: ${{ runner.os }}-dylint-driver-nightly-2026-04-16
      - name: Cache vendored extractor build
        uses: actions/cache@v6
        with:
          path: ~/.cache/workspace-lint
          key: ${{ runner.os }}-wl-extractor-nightly-2026-04-16-${{ hashFiles('extractor/**', 'crates/wl-ir/**') }}
          restore-keys: ${{ runner.os }}-wl-extractor-nightly-2026-04-16-
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: taiki-e/install-action@v2.86.7
        with:
          tool: cargo-crap
      - uses: Swatinem/rust-cache@v2
      # Build the dylint driver + extractor dylib BEFORE llvm-cov exports its
      # instrumentation RUSTFLAGS: on a driver-cache miss dylint builds the
      # driver with the inherited env, and a driver instrumented on the pinned
      # nightly would emit profraw that stable's llvm-profdata can't merge.
      # (Doubles as the dogfood run for this job.)
      - name: Warm the extraction engine outside coverage flags
        run: cargo run -q -p workspace-lint --locked
      - name: Generate coverage
        run: cargo cov
      - name: Score complexity-weighted coverage
        run: cargo cov-crap --fail-above
