name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  checks:
    name: Checks (fmt, typos, audit, clippy, doc, publish)
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Format
        run: cargo fmt --all --check
      - name: Typos
        uses: crate-ci/typos@v1
      - name: Audit
        run: cargo audit
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Clippy (syn-workspace, no default features)
        run: cargo clippy -p syn-workspace --no-default-features --locked -- -D warnings
      - name: Docs
        run: cargo doc --workspace --no-deps --locked
      - name: Build oracle-bless tool (detached harness; compile-only, catches API drift)
        run: cargo build --manifest-path tools/oracle-bless/Cargo.toml --locked
      - name: Publish dry-run (publishable libs)
        run: |
          cargo publish --dry-run -p syn-workspace-marker --allow-dirty
          cargo publish --dry-run -p workspace-lint-marker --allow-dirty
          cargo publish --dry-run -p syn-workspace --allow-dirty
          cargo publish --dry-run -p wl-ir --allow-dirty

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Phase-2 corpus crates are git submodules under `corpus/`. The corpus
      # tests (smoke / lint-FP audit / set-level SCIP differential) load them via
      # `cargo metadata --no-deps`, so they need no network — but they do need the
      # submodule sources checked out. Without them the corpus tests skip cleanly.
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      # The full tier is live: `unused-deps` runs on the rustc engine, so the
      # dogfood test and the unused-deps case fixtures extract IR during the
      # suite. That needs the pinned nightly (+ rustc-dev), dylint-link, and —
      # cached, because it's the slowest cold step — dylint's per-toolchain
      # driver. Keep the pin in lockstep with extractor/rust-toolchain.toml.
      - name: Install pinned nightly (+ rustc-dev) for the extraction engine
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-04-16
          components: rustc-dev, llvm-tools-preview
      # dtolnay/rust-toolchain sets the LAST installed toolchain as default;
      # the workspace builds on stable, so restore it explicitly.
      - name: Restore stable as default
        run: rustup default stable
        shell: bash
      - name: Install dylint-link
        run: cargo install dylint-link --locked
      - name: Cache dylint driver
        uses: actions/cache@v4
        with:
          path: ~/.dylint_drivers
          key: ${{ runner.os }}-dylint-driver-nightly-2026-04-16
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
      - run: cargo nextest run --workspace --locked
      # Semantic-lint fixtures (architecture / unused-deps / unused-pub) must
      # `cargo check` offline: the rustc-driver engine those lints are being
      # ported onto compiles the analyzed workspace. Ubuntu-only — the gate is
      # about the fixtures' Rust source, not platform behavior — and after
      # nextest so the cargo cache already holds the root dependency tree the
      # fixtures draw their registry deps from.
      - name: Semantic fixture compile sweep
        if: matrix.os == 'ubuntu-latest'
        run: WL_FIXTURE_COMPILE=1 cargo test -p workspace-lint --test fixture_compile --locked -- --nocapture
      # nextest does not run doctests — exercise them (incl. the published
      # syn-workspace lib.rs example) so a broken doc example can't ship.
      - name: Doctests
        run: cargo test --doc --workspace --locked

  crap:
    name: CRAP (coverage × complexity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-crap
      - uses: Swatinem/rust-cache@v2
      - name: Generate coverage
        run: cargo cov
      - name: Score complexity-weighted coverage
        run: cargo cov-crap --fail-above
