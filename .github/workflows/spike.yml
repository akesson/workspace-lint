# Spike-only CI (the rustc-fidelity pivot). Proves the remaining spike plumbing
# on LINUX: the stable `wl-embed` orchestrator drives the extractor dylib (built
# from the promoted `extractor/` package since migration PR 2) over this
# workspace, and Phase-2 `wl-assemble` renders its report. The extractor's own
# build + probe-policy test run in extractor.yml (3 OSes); this workflow covers
# the embed→assemble path the spike still owns until PRs 3–4 promote it.
#
# Deliberately isolated: the spike is `exclude`d from the main workspace, so the
# real `ci.yml` never touches it. Runs on the spike/migration branches and on
# manual dispatch; retires with spike/ in migration PR 13.
name: Spike (rustc-fidelity)

on:
  workflow_dispatch:
  push:
    branches: ["spike-*", "migrate/*"]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  linux-smoke:
    name: Linux plumbing smoke (.so + dylint-link + extract + assemble)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The lint dylib links rustc_private, so it needs the PINNED nightly (the
      # one dylint 6.0.1 tracks) plus rustc-dev. extractor/rust-toolchain.toml
      # selects it, but install the components explicitly so the runner has them.
      - name: Install pinned nightly (+ rustc-dev)
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-04-16
          components: rustc-dev, llvm-tools-preview
      - name: Install stable (for the wl-embed orchestrator)
        uses: dtolnay/rust-toolchain@stable

      # The custom linker the lint dylib needs (extractor/.cargo/config.toml).
      - name: Install dylint-link
        run: cargo install dylint-link --locked

      - name: Cache dylint driver
        uses: actions/cache@v4
        with:
          path: ~/.dylint_drivers
          key: ${{ runner.os }}-dylint-driver-nightly-2026-04-16

      - name: Build extractor dylib (pinned nightly → .so on Linux)
        working-directory: extractor
        run: cargo build --locked

      - name: Build wl-embed (stable orchestrator)
        working-directory: spike/embed
        run: cargo +stable build

      # Plain-data crate (no rustc_private): build with the already-installed
      # pinned nightly, overriding the spike workspace's rolling-nightly pin, so
      # the runner needs no third toolchain.
      - name: Build wl-assemble
        working-directory: spike
        run: cargo +nightly-2026-04-16 build -p wl-assemble

      # Locate the dylib generically — the filename embeds the toolchain + host
      # triple and the extension is .so here, .dylib on macOS.
      - name: Locate extractor dylib
        id: lib
        run: echo "path=$(ls extractor/target/debug/libwl_extractor@*.so)" >> "$GITHUB_OUTPUT"

      # Whole-workspace extraction (dylint fans out over members) + Phase-2
      # assembly renders its report without error.
      - name: Extract this workspace + assemble
        run: |
          set -euo pipefail
          ./spike/embed/target/debug/wl-embed "$PWD" "${{ steps.lib.outputs.path }}" "$PWD/spike/ir-ci-ws"
          test "$(ls spike/ir-ci-ws | wc -l)" -ge 5
          ./spike/target/debug/wl-assemble "$PWD/spike/ir-ci-ws" --ws "$PWD"
