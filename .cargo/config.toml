[alias]
cov = "llvm-cov --workspace --lcov --output-path lcov.info"
cov-html = "llvm-cov --workspace --open"
cov-summary = "llvm-cov --workspace --summary-only"
# `spike/`, `corpus/`, and `extractor/` are `exclude`d from the workspace (see
# root Cargo.toml), so `cargo cov` never instruments them and they carry no
# lcov entry — scoring them as 0%-covered would blow up CRAP. Keep the CRAP
# scope == the coverage scope. (The extractor compiles only on its pinned
# nightly; its correctness gate is the probe suite in `extractor/tests`.)
#
# `**/legacy.rs` = the per-lint syn-backend halves of the transitional
# WL_SEMANTIC_BACKEND split (die in migration PR 12). Their only end-to-end
# coverage is `corpus_fp` (pinned to syn), which needs the corpus submodules —
# absent on CI's CRAP job checkout, so they'd score 0% there. Gated by
# backend-diff + corpus_fp instead. Remove this exclude with the legacy code.
#
# String form, not array form: cargo merges configs from every `.cargo/` on the
# path from cwd to root, and ARRAY values concatenate across levels while
# STRING values override. A worktree nested inside the checkout (e.g.
# `.claude/worktrees/<name>`) sees this file twice, and the array form doubled
# the argv (`crap --lcov … crap --lcov …`), breaking `cargo cov-crap` there.
cov-crap = "crap --lcov lcov.info --exclude **/tests/** --exclude **/tests.rs --exclude **/legacy.rs --exclude **/tools/** --exclude spike/** --exclude corpus/** --exclude extractor/** --allow *::fmt"
