# Isolated spike workspace for the rustc-fidelity IR pivot (step 0).
# Excluded from the main workspace (see repo-root Cargo.toml `exclude`) so it
# never touches the stable build or the dogfood lint. Everything here builds on
# the pinned nightly (rust-toolchain.toml) because the driver links rustc_private.
[workspace]
resolver = "2"
members = ["driver", "assemble"]

[workspace.dependencies]
# The IR contract graduated to the main workspace (migration PR 1); the spike
# crates keep consuming it by path until they retire.
wl-ir = { path = "../crates/wl-ir" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Phase-2 roots: `wl-assemble --ws <root>` reads per-crate publish + target kind to
# split "unused in workspace" (published-lib API surface) from "dead" (bin / not
# publishable). Same version already in the lock via syn-workspace (SPIKE §7 step 5).
cargo_metadata = "0.23"
