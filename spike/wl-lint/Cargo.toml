[package]
name = "wl_lint"
version = "0.1.0"
authors = ["workspace-lint"]
description = "Phase-1 rustc-fidelity IR extractor, as a Dylint LateLintPass"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# NOTE: no clippy_utils — extract() uses raw rustc_middle/rustc_hir, so we skip
# the clippy_utils<->nightly alignment entirely (SPIKE §12.4). We only need the
# dylint macro/registration glue.
dylint_linting = "6.0.1"
wl-ir = { path = "../ir" }
serde_json = "1"

[dev-dependencies]
dylint_testing = "6.0.1"

[workspace]

[package.metadata.rust-analyzer]
rustc_private = true
