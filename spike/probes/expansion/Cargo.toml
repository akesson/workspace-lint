# Purpose-built probe for the WS1 macro-expansion span policy (SPIKE §12.7).
# A *lint target*, not a spike-workspace member: it has its own empty
# `[workspace]` table so the extractor (embed → dylint → driver) compiles it in
# isolation on whatever toolchain, exactly like a real downstream crate. The
# dangerous case it exercises: an item whose `pub` token lives in a *different*
# file (a cross-file `macro_rules!`), which must never become a `--fix` write
# surface. See `spike/probe-check` for the assertions.
[package]
name = "probe-expansion"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]
