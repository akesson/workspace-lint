# Dogfood config: workspace-lint linting itself.
#
# Run via `cargo run -p workspace-lint` (or the CI step in .github/workflows/ci.yml).
# Any over-limit file gets either a real fix or an `expect!`/`# workspace-lint:
# expect(...)` directive so the silence is load-bearing — when the file shrinks
# back under the limit, `stale-expect` nudges us to clean up.

# Lint levels. `[lints]` is the single place a lint is enabled and leveled.
# Structural lints (centralized-deps, orphan-file, feature-drift, unused-deps,
# unused-pub, stale-expect) are on by default at `warn`; the entries below escalate
# the ones this repo enforces to `deny`. Only a surviving `Deny`-level finding
# flips the exit code, and the dogfood test asserts exit 0.
#
# `feature-drift` is intentionally left at its default `warn` (visible but not
# CI-failing). The policy lint `cli-crate-version` is off because this repo
# configures no rules for it; add a `[[cli-crate-version.rules]]` table to
# opt in.
[lints]
centralized-deps = "deny"
crate-size = "deny"
duplicate-code = "deny"
file-size = "deny"
# Module-tree integrity (broken `mod` decls / orphan src files). Denied so a
# resolution regression — e.g. a target root failing to find a sibling
# `mod common;`, or a renamed module leaving a stale file — fails dogfood
# instead of silently shrinking the analyzed surface.
orphan-file = "deny"
unused-deps = "deny"
unused-pub = "deny"
stale-expect = "deny"
# Validate this very config: a typo'd section or lint name fails the run
# instead of silently doing nothing.
config = "deny"
unknown-lint = "deny"

# Applies to every crate's `src/` tree, not just the binary — the resolver no
# longer exempts itself from the 500-line discipline. Counts *shipped* source
# only (the same production-only metric `crate-size` uses: `#[cfg(test)]` items,
# `#[test]` fns, and dev-target trees are excluded — see `wl_fast::shipped_source`),
# so a file's number reflects maintained product code, not its test mass.
[[file-size.rules]]
glob = "crates/*/src/**/*.rs"
max-code-lines = 500

[[crate-size.rules]]
glob = "crates/*"
# Counts *shipped* Rust source only: committed data (JSON oracle snapshots,
# TOML fixtures) is skipped, and so is test code — the `tests/`/`benches/`/
# `examples/` dev-target trees and in-file `#[cfg(test)]` items / `#[test]`
# fns (a crate-size budget is about maintained product code, not the test
# mass that dwarfs it — see `wl_fast::shipped_source`, shared with `file-size`).
# The binary used to be the binding crate and grew past 6k as lints piled up;
# it was split into `wl-lints` (every lint impl) and `wl-diagnostic` (the
# diagnostic vocabulary + renderers), leaving the binary as just the pipeline +
# config + registry (~2.1k). `wl-engine` tripped the ceiling next (the
# commands-as-configs parser pushed it past 4k) and shed its build-free tier
# into `wl-fast`. `wl-lints` hit the ceiling after `duplicate-code` and shed
# its two non-judgment masses: that lint's detection *engine* (the syntactic
# clone finder, now `wl_fast::clones` — same scanner family as
# `shipped_source`) and everything a lint builds on that isn't judgment (the
# `Lint`/`LintId` vocabulary, config primitives, git/util helpers, and the
# deletion/import-excision fix surgery — now `wl-lint-api`), keeping every
# lint's judgment + diagnostics together. `wl-engine` tripped again after the
# schema-8 glob work and shed its whole **Phase-1 tier** — the extractor
# orchestration (vendor/build/drive + completeness guard), the
# commands-as-configs parser, and the cfg-shadow `coverage` index — into
# `wl-orchestrate`, leaving `wl-engine` the pure Phase-2 assembler that
# re-exports it (so `dylint`/`anyhow` leave the assembler's dep graph). The
# ceiling stays at 4000: enough headroom for a modest addition anywhere, tight
# enough that the next real growth spurt trips it and prompts the next
# extraction rather than a higher ceiling.
max-code-lines = 4000

# Name-invariant (Type-2) duplicate detection at the built-in thresholds
# (min-lines = 8, min-tokens = 40, literals abstracted, test code skipped,
# the two default-on noise filters: min-distinct-anchors = 4,
# min-non-repeating-ratio = 0.5 — boilerplate that is name-poor or
# self-repeating never surfaces — and the extraction-cost gate
# max-parameters = 3: a group whose literals vary in more than three
# independent ways is a data table, not copy-paste, unless one literal
# breaks an otherwise consistent mapping — probable copy-paste drift, which
# always surfaces). Denied so a copy-paste between lints/crates fails
# dogfood: the fix is extraction, or a load-bearing `expect!` where the twin
# structure is deliberate. Adoption surfaced four real clone groups
# (`LintId::short`'s hand-synced twin match, the expand walk, the
# unused-deps/-pub check scaffolding, the DegreeView constructors) — all
# resolved by extraction, so no directive was needed.
[duplicate-code]

# The rustc engine's config matrix: the real cargo commands this repo runs
# (one `cargo check`-fidelity compile per entry; the verdict unions across
# them). `cargo test` is load-bearing for `unused-deps`: dev-dependencies are
# judged only when a test target actually compiles — without it they'd be
# silently skipped, weaker than the syn backend this replaced. It also retires
# test-only `unused-pub` leads. (This matches the default matrix; declared
# explicitly as living documentation.)
[engine]
configs = ["cargo build", "cargo test"]

# `unused-deps` `ignore` is scoped per-crate (a worked example of the
# `[crates.<name>]` tier): these deps are unused only in the `workspace-lint`
# binary, so scoping the ignore here keeps it from masking a genuinely-unused
# `proc-macro2` (etc.) that might later appear in another member. A per-crate
# section *wholesale-replaces* the (empty) global `[unused-deps]` for this crate.
[crates.workspace-lint.unused-deps]
ignore = [
    # Pulled in only for the `span-locations` feature unification with `syn`.
    "proc-macro2",
    # Build-script-only (installs git hooks); never appears in source.
    "cargo-husky",
]

# `unused-pub` runs on the rustc engine, so it runs everywhere — local + CI
# dogfood. It's publish-aware: a crate's public API is treated as external
# (and exempt) only when the crate declares `publish = true`. The published
# libraries here (workspace-lint-marker, wl-ir) set `publish = true`, so their
# APIs aren't flagged; the `workspace-lint` binary publishes no API, so its
# `pub` items are checked as workspace-internal (as before).
# Cross-config note: an item used cross-crate only from another crate's test
# code (e.g. `wl_diagnostic::render::render_one`, called only by the binary's
# message-surface snapshot tests) is now seen correctly — the assembler's hash
# join is global across `[engine] configs`, so a `+test`-unit edge to a
# dependency's plain rlib resolves to the def the primary config extracted (see
# `wl-engine/src/semantic/join.rs`). No allowlist entry is needed for it.
[unused-pub]
