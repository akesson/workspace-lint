# Dogfood config: workspace-lint linting itself.
#
# Run via `cargo run -p workspace-lint` (or the CI step in .github/workflows/ci.yml).
# Any over-limit file gets either a real fix or an `expect!`/`# workspace-lint:
# expect(...)` directive so the silence is load-bearing — when the file shrinks
# back under the limit, `stale-expect` nudges us to clean up.

# Lint levels. `[lints]` is the single place a lint is enabled and leveled.
# Structural lints (centralized-deps, module-tree, feature-drift, unused-deps,
# unused-pub, stale-*) are on by default at `warn`; the entries below escalate
# the ones this repo enforces to `deny`. Only a surviving `Deny`-level finding
# flips the exit code, and the dogfood test asserts exit 0.
#
# `feature-drift` is intentionally left at its default `warn` (visible but not
# CI-failing). The policy lints `freshness` / `cli-crate-version` are off
# because this repo configures no rules for them; add a `[[freshness.rules]]` /
# `[[cli-crate-version.rules]]` table to opt in.
[lints]
centralized-deps = "deny"
crate-size = "deny"
file-size = "deny"
# Module-tree integrity (broken `mod` decls / orphan src files). Denied so a
# resolution regression — e.g. a target root failing to find a sibling
# `mod common;`, or a renamed module leaving a stale file — fails dogfood
# instead of silently shrinking the analyzed surface.
module-tree = "deny"
unused-deps = "deny"
unused-pub = "deny"
stale-expect = "deny"
stale-git-index = "deny"
# Validate this very config: a typo'd section or lint name fails the run
# instead of silently doing nothing.
config = "deny"
unknown-lint = "deny"

# Applies to every crate's `src/` tree, not just the binary — the resolver no
# longer exempts itself from the 500-line discipline. Counts *shipped* source
# only (the same production-only metric `crate-size` uses: `#[cfg(test)]` items,
# `#[test]` fns, and dev-target trees are excluded — see `lints::shipped_source`),
# so a file's number reflects maintained product code, not its test mass.
[[file-size.rules]]
glob = "crates/*/src/**/*.rs"
max-code-lines = 500

[[crate-size.rules]]
glob = "crates/*"
# Counts *shipped* Rust source only: committed data (JSON oracle snapshots,
# TOML fixtures) is skipped, and so is test code — the `tests/`/`benches/`/
# `examples/` dev-target trees and in-file `#[cfg(test)]` items / `#[test]`
# fns (a crate-size budget is about maintained product code, not the test
# mass that dwarfs it — see `wl_lints::shipped_source`, shared with `file-size`).
# The binary used to be the binding crate and grew past 6k as lints piled up;
# it was split into `wl-lints` (every lint impl) and `wl-diagnostic` (the
# diagnostic vocabulary + renderers), leaving the binary as just the pipeline +
# config + registry (~2.1k). `wl-engine` (~3.1k) is now the largest crate, so
# the ceiling sits at 3500 — enough headroom for a modest addition anywhere,
# tight enough that the next real growth spurt trips it and prompts the next
# extraction rather than a higher ceiling.
max-code-lines = 3500

# The rustc engine's config matrix (one `cargo check` compile per entry; the
# verdict unions across them). `--tests` is load-bearing for `unused-deps`:
# dev-dependencies are judged only when a test target actually compiles —
# without it they'd be silently skipped, weaker than the syn backend this
# replaced. It also retires test-only `unused-pub` leads once that lint ports.
[engine]
configs = ["default", "--tests"]

# `unused-deps` `ignore` is scoped per-crate (a worked example of the
# `[crates.<name>]` tier): these deps are unused only in the `workspace-lint`
# binary, so scoping the ignore here keeps it from masking a genuinely-unused
# `proc-macro2` (etc.) that might later appear in another member. A per-crate
# section *wholesale-replaces* the (empty) global `[unused-deps]` for this crate.
[crates.workspace-lint.unused-deps]
ignore = [
    # Pulled in only for the `span-locations` feature unification with `syn`.
    "proc-macro2",
    # Build-script-only (installs git hooks); never appears in source.
    "cargo-husky",
]

# `unused-pub` runs on the rustc engine, so it runs everywhere — local + CI
# dogfood. It's publish-aware: a crate's public API is treated as external
# (and exempt) only when the crate declares `publish = true`. The published
# libraries here (workspace-lint-marker, wl-ir) set `publish = true`, so their
# APIs aren't flagged; the `workspace-lint` binary publishes no API, so its
# `pub` items are checked as workspace-internal (as before).
[unused-pub]
# `wl_diagnostic::render::render_one` renders a single diagnostic without the
# run summary; its only in-workspace callers are the binary's message-surface
# snapshot tests (`messages.rs` / `messages_quality.rs`). The engine can't see
# that use: under the `--tests` config a member's cfg(test) code links against
# the cfg-OFF build of `wl-diagnostic`, but cargo freshness means only the
# cfg-ON (`+test`) fragment is re-extracted there, so the referrer's DefPathHash
# never matches a captured def and the item reads as unused. Allowlisted (matches
# the def-path `cand.id`) so this engine blind spot for test-only cross-crate use
# of an unpublished crate can't fail the dogfood.
allowlist = ["wl_diagnostic::render::render_one"]
