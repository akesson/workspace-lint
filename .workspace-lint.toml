# Dogfood config: workspace-lint linting itself.
#
# Run via `cargo run -p workspace-lint` (or the CI step in .github/workflows/ci.yml).
# Any over-limit file gets either a real fix or an `expect!`/`# workspace-lint:
# expect(...)` directive so the silence is load-bearing — when the file shrinks
# back under the limit, `stale-expect` nudges us to clean up.

# Lint levels. `[lints]` is the single place a lint is enabled and leveled.
# Structural lints (centralized-deps, module-tree, feature-drift, unused-deps,
# unused-pub, stale-*) are on by default at `warn`; the entries below escalate
# the ones this repo enforces to `deny`. Only a surviving `Deny`-level finding
# flips the exit code, and the dogfood test asserts exit 0.
#
# `feature-drift` is intentionally left at its default `warn` (visible but not
# CI-failing). The policy lints `freshness` / `cli-crate-version` are off
# because this repo configures no rules for them; add a `[[freshness.rules]]` /
# `[[cli-crate-version.rules]]` table to opt in.
[lints]
centralized-deps = "deny"
crate-size = "deny"
file-size = "deny"
# Module-tree integrity (broken `mod` decls / orphan src files). Denied so a
# resolution regression — e.g. a target root failing to find a sibling
# `mod common;`, or a renamed module leaving a stale file — fails dogfood
# instead of silently shrinking the analyzed surface.
module-tree = "deny"
unused-deps = "deny"
unused-pub = "deny"
stale-expect = "deny"
stale-git-index = "deny"
# Validate this very config: a typo'd section or lint name fails the run
# instead of silently doing nothing.
config = "deny"
unknown-lint = "deny"

[[file-size.rules]]
glob = "crates/workspace-lint/src/**/*.rs"
max-code-lines = 500

[[crate-size.rules]]
glob = "crates/*"
# Counts Rust source only (`*.rs`); committed data (JSON oracle snapshots,
# TOML fixture manifests under a crate's `tests/`) no longer inflates the
# budget. syn-workspace is ~4.6k Rust lines (src + test-fixture `.rs`), so
# 6000 leaves headroom while still tripping on real source growth. (The
# 7000 bump in #33 was a workaround for JSON inflation — now unnecessary.)
max-code-lines = 6000

[unused-deps]
# Direct deps whose names don't appear in source. Kept as workspace-level
# `ignore` (not per-dep `expect` comments in each Cargo.toml) because the
# diagnostic is anchored at the whole crate with one `help:` per unused dep —
# a crate-level `expect` would silence the diagnostic entirely, suppressing
# any *new* unused deps that appear later. To migrate, unused-deps must first
# emit one diagnostic per dep (refactor: src/lints/unused_deps/mod.rs,
# messages.rs scenarios, tests/cases/unused-deps/ fixtures).
ignore = [
    # Pulled in only for the `span-locations` feature unification with `syn`.
    "proc-macro2",
    # Build-script-only (installs git hooks); never appears in source.
    "cargo-husky",
    # Macros are referenced by path `workspace_lint_marker::` in src/; the
    # unused-deps name-stripping heuristic doesn't see it.
    "workspace-lint-marker",
    # Pre-added for a planned follow-up routing non-insertion suggestions
    # through it (see src/fix.rs). Not imported yet — drop the dep if no movement.
    "rustfix",
]

# `unused-pub` is resolver-backed (no SCIP, no rust-analyzer subprocess), so it
# runs everywhere — local + CI dogfood — without extra installs. It's
# publish-aware: a crate's public API is treated as external (and exempt) only
# when the crate declares `publish = true`. The published libraries here
# (syn-workspace + the two marker crates) set `publish = true`, so their APIs
# aren't flagged; the `workspace-lint` binary publishes no API, so its `pub`
# items are checked as workspace-internal (as before).
[unused-pub]
