# This manifest is deliberately SELF-CONTAINED (no `workspace = true`
# inheritance): the workspace-lint binary vendors this crate together with
# `extractor/` and materializes both into a cache dir at user sites, where no
# workspace root exists to inherit from. Keep every field concrete.
[package]
name = "wl-ir"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
# Deliberately unpublished: the schema ships only vendored inside the binary
# (alongside `extractor/`). Its real consumer — the extractor — is
# workspace-excluded and thus invisible to the unused-pub dogfood, so the
# dogfood config excludes this crate rather than judging it blind.
publish = false
repository = "https://github.com/akesson/workspace-lint"
description = "The serde IR contract between workspace-lint's per-crate rustc extractor (Phase 1) and its workspace assembler (Phase 2)."
license = "MIT OR Apache-2.0"

[dependencies]
# workspace-lint: expect(centralized-deps) — must stay concrete; see the
# self-containment note at the top of this file. Covers every dep in this
# manifest (the lint emits one crate-level diagnostic aggregating all of them).
serde = { version = "1", features = ["derive"] }
# The on-disk transport: fragments are rkyv archives (zero-copy mmap on read),
# with serde kept only for the `dump-ir` debug JSON path.
rkyv = "0.8"
