[package]
name = "syn-workspace"
version = "0.5.0"
edition = "2024"
rust-version.workspace = true
# Published to crates.io — and the signal workspace-lint's publish-aware
# `unused-pub` uses to treat this crate's public API as external (so its items
# aren't flagged just because no *workspace* crate references them).
publish = true
repository = "https://github.com/akesson/workspace-lint"
description = "A resolved workspace model for Rust: per-file imports, cross-file module trees, pub-use chains, and macro-body parsing — built on syn, no rust-analyzer required."
license = "MIT OR Apache-2.0"
keywords = ["syn", "workspace", "cargo", "ast", "resolver"]
categories = ["development-tools", "parser-implementations"]
readme = "README.md"

[features]
default = ["dioxus"]
# `dioxus` enables the `rsx!` / `dioxus::rsx!` macro-body parser. Disabling
# it drops the `dioxus-rsx` dep (and its transitives) for users who don't
# need Dioxus component-path detection. See `src/plugins/dioxus_rsx/`.
dioxus = ["dep:dioxus-rsx"]

[dependencies]
cargo_metadata = { workspace = true }
dioxus-rsx = { workspace = true, optional = true }
proc-macro2 = { workspace = true }
quote = { workspace = true }
syn = { workspace = true }
toml_edit = { workspace = true }

[dev-dependencies]
# tests/oracle.rs (the committed differential-oracle regression net) reads the
# committed normalized JSON oracles. Generation of those oracles lives in the
# detached `tools/oracle-bless` crate, so the fast test path needs only serde_json.
serde_json = { workspace = true }
# tests/corpus.rs copies each submoduled corpus crate to a tempdir before loading
# it, so `cargo metadata`'s side effects never touch the read-only checkout.
tempfile = { workspace = true }
