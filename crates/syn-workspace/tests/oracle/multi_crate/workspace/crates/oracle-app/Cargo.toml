[package]
name = "oracle-app"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[dependencies]
# The one declared dependency the SCIP dep-set oracle proves is referenced.
oracle-core = { path = "../oracle-core" }

[dev-dependencies]
# A genuinely-used DEV dependency — the dep-set oracle must classify it as
# DevDependencies and exclude it from the [dependencies] set it checks.
oracle-extra = { path = "../oracle-extra" }
