[package]
name = "wl-engine"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
# Deliberately unpublished: the engine ships only inside the binary, and the
# deny-level unused-pub dogfood judges this crate's pub API workspace-
# internally (same convention as wl-orchestrate).
publish = false
repository = "https://github.com/akesson/workspace-lint"
description = "workspace-lint's engine library: the Phase-2 workspace-model assembler, and the single engine surface re-exporting the Phase-1 orchestrator (wl-orchestrate) and the build-free tier (wl-fast)."
license = "MIT OR Apache-2.0"

[dependencies]
wl-ir = { path = "../wl-ir" }
# The build-free fast tier, re-exported as `wl_engine::fast` (+ `timing`).
wl-fast = { path = "../wl-fast" }
# Phase-1 orchestration, re-exported as `wl_engine::orchestrate` (+ `coverage`).
# The semantic assembler consumes its `ExtractionRuns`; `dylint`/`anyhow` are
# its concern, not this crate's — keeping "Phase 2 is plain data" structural.
wl-orchestrate = { path = "../wl-orchestrate" }
cargo_metadata = { workspace = true }
thiserror = { workspace = true }
# semantic tier: fragments are read zero-copy — mmap the file, access the rkyv
# archive in place (see FragmentBytes / semantic::store).
memmap2 = { workspace = true }
rkyv = { workspace = true }
# semantic tier: the per-config assemblies build concurrently — one rayon task
# per `[engine] config` (they share only the read-only `IdentityIndex`) — and
# the join's hot lookups are fast-hash (fixed-seed `foldhash`) `IndexMap`s
# rather than BTreeMap<String> string compares over ~100k defs per edge.
rayon = { workspace = true }
indexmap = { workspace = true }
foldhash = { workspace = true }

[dev-dependencies]
# Semantic-assembler tests (semantic/tests.rs) and the e2e harness materialize
# into throwaway dirs.
tempfile = { workspace = true }
