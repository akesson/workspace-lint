[package]
name = "alpha"
version = "0.1.0"
edition = "2024"
# Published → the public struct is exempt; only the private-`mod` types are
# evaluated, isolating the guard's discrimination (one suppressed, one flagged).
publish = true

[dependencies]
# Compile-only stub (see stubs/): the lint recognizes `#[builder(...)]` from
# the source text; the dep exists so the fixture `cargo check`s offline.
typed-builder = { path = "../../stubs/typed-builder" }
