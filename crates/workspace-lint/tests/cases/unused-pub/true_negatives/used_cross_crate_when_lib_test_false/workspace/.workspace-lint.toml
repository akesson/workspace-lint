[lints]
default = "allow"
unused-pub = "warn"

# Same shape as `used_cross_crate_from_test_mod`, but alpha's lib sets
# `test = false` (see its Cargo.toml): under `--tests` no alpha unit compiles
# at all, so there is no local def for the global hash join to translate onto
# — beta's plain-generation test reference is credited through the
# foreign-reach channel instead. Pre-channel (and pre-guard-fix) this fixture
# hard-errored: the guard expected `alpha+test.json`, a unit cargo never
# builds for a `test = false` target.
[engine]
configs = ["cargo build", "cargo test"]
