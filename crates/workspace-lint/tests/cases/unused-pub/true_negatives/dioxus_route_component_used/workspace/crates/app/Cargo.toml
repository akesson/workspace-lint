# No `publish` field → treated as workspace-internal, so unused `pub` items are
# flagged (not exempted as external API surface). This is what makes the route
# components candidates for the false positive. No real Dioxus dependency is
# needed: the resolver recognizes `#[derive(Routable)]`, `#[route]`, `#[layout]`,
# and `#[component]` by name; nothing compiles.
[package]
name = "app"
version = "0.1.0"
edition = "2024"
