# No `publish` field → treated as workspace-internal, so unused `pub` items are
# flagged (not exempted as external API surface). This is what makes the route
# components candidates for the false positive. No real Dioxus dependency is
# needed by the *resolver* — it recognizes `#[derive(Routable)]`, `#[route]`,
# `#[layout]`, and `#[component]` by name; the stub dep below exists only so
# the fixture `cargo check`s offline.
[package]
name = "app"
version = "0.1.0"
edition = "2024"

[dependencies]
dioxus = { path = "../../stubs/dioxus" }
