[unused-pub]
# Same shape as `used_cross_crate_from_test_mod` — `alpha::helper` is called
# only from `beta`'s `#[cfg(test)]` code through a dev-dependency — but with
# NO `[engine]` table: this case is the forcing function for the DEFAULT
# matrix being `["cargo build", "cargo test"]`. If the default ever regresses
# to a single host config, the test universe goes unseen, `helper` reads
# "appears unused", and this true negative fails.

[lints]
default = "allow"
unused-pub = "warn"
