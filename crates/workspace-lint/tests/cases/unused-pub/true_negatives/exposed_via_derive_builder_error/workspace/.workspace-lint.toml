# Macro-generated signature exposure, derive_builder form. `BuildErr`'s only
# reference is its own `impl From<String>` (not a use). derive_builder expands
# `#[builder(build_fn(error = "BuildErr"))]` into
# `pub fn build(&self) -> Result<Widget, BuildErr>`, a generated public
# signature exposing `BuildErr`; the engine extracts the expansion, so the
# exposure is seen natively → suppressed → all passed.
[unused-pub]

[lints]
default = "allow"
unused-pub = "deny"

# Pinned single-config matrix: this case is not about the engine matrix —
# keep the fixture single-pass (the absent-table default is build+test).
[engine]
configs = ["cargo build"]
