[unused-pub]
allowlist = ["*MyHelper"]
# Workspace-relative globs, both forms: root-anchored and any-depth.
exclude-paths = ["crates/alpha/src/generated/**", "**/vendor/**"]

[lints]
default = "allow"
unused-pub = "warn"

# Pinned single-config matrix: this case is not about the engine matrix —
# keep the fixture single-pass (the absent-table default is build+test).
[engine]
configs = ["cargo build"]
