[unused-pub]
# The component is used only *within* the crate (one bare `rsx!` site), so once
# the Phase B Dioxus pass links the usage it reads as IntraCrate; this drops the
# "consider pub(crate)" nag, leaving a clean pass. Without the pass the usage is
# invisible and `Card` reads Unused → "appears unused" (the false positive this
# fixture guards against).
suppress-intra-crate = true

[lints]
default = "allow"
unused-pub = "warn"

# Pinned single-config matrix: this case is not about the engine matrix —
# keep the fixture single-pass (the absent-table default is build+test).
[engine]
configs = ["cargo build"]
