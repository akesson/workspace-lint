# Contrast with true_positives/internal_crate_root_pub_fn_flagged: the only
# difference is `publish = true` on the crate. A published crate is assumed to
# have out-of-workspace consumers, so its library-public API is exempt even
# when nothing in the workspace references it.
[unused-pub]

[lints]
default = "allow"
unused-pub = "deny"

# Pinned single-config matrix: this case is not about the engine matrix —
# keep the fixture single-pass (the absent-table default is build+test).
[engine]
configs = ["cargo build"]
