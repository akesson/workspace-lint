[unused-deps]

[lints]
default = "allow"
unused-deps = "warn"

# The wasm-bindgen usage lives inside `#[cfg(test)]` generated code and the
# wasm-bindgen-test dev-dep is judgeable only when a test target compiles —
# both need the `cargo test` config in the rustc engine's matrix.
[engine]
configs = ["cargo build", "cargo test"]
