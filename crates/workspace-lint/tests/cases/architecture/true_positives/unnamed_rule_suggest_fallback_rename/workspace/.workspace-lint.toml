# No `name`, `suggest`, or `reason`: exercises the "unnamed" rule label and the
# generated help fallback. The import uses `as`, exercising the rename note.
[[architecture.rules]]
from = ["apps-*"]
deny = ["data-models::internal::**"]

[lints]
default = "allow"
architecture = "deny"

# Pinned single-config matrix: this case is not about the engine matrix —
# keep the fixture single-pass (the absent-table default is build+test).
[engine]
configs = ["cargo build"]
