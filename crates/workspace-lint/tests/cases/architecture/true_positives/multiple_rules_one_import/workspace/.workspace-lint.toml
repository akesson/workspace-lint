# Two rules both match the same import; the lint emits one diagnostic per rule.
[[architecture.rules]]
name = "no-internals"
from = ["apps-*"]
deny = ["data-models::internal::**"]

[[architecture.rules]]
name = "no-data-models-at-all"
from = ["apps-*"]
deny = ["data-models::**"]

[lints]
default = "allow"
architecture = "deny"

# Pinned single-config matrix: this case is not about the engine matrix —
# keep the fixture single-pass (the absent-table default is build+test).
[engine]
configs = ["cargo build"]
