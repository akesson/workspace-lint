# Exception symmetry. `deny` targets `internal`'s children; the exception names
# the bare `internal` MODULE — a strict ancestor of the denied item, not the
# item itself. A fully-qualified `internal::Secret::new()` must still fire: an
# exception only exempts at or below the denied prefix (`...::Secret`), never a
# broader ancestor — matching the `use`-binding pass, which checks the item.
[[architecture.rules]]
name = "apps-no-data-internals"
from = ["apps-*"]
deny = ["data-models::internal::**"]
exceptions = ["data-models::internal"]

[lints]
default = "allow"
architecture = "deny"

# Pinned single-config matrix: this case is not about the engine matrix —
# keep the fixture single-pass (the absent-table default is build+test).
[engine]
configs = ["cargo build"]
