# Two doc/source pairs in one run: `stale`'s doc (order 0) is older than its
# source (order 1) and must fire; `fresh`'s doc (order 3) is newer than its
# source (order 2) and must NOT. Only the stale crate is flagged.
[[mtime]]
path = "crates/stale/CLAUDE.md"
order = 0

[[mtime]]
path = "crates/stale/src/lib.rs"
order = 1

[[mtime]]
path = "crates/fresh/src/lib.rs"
order = 2

[[mtime]]
path = "crates/fresh/CLAUDE.md"
order = 3
