[package]
name = "alpha"
version = "0.1.0"

[dependencies]
# `serde` IS centralized in [workspace.dependencies], so --fix rewrites it.
serde = "1.0.200"
# `rand` is NOT in [workspace.dependencies]: `rand = { workspace = true }` would
# break the manifest, so the suggestion is MaybeIncorrect and --fix must leave
# this line untouched.
rand = "0.8"
