# The known-behavior fixture for the per-file git gate: the manifest carrying
# the unused dep is dirtied AFTER the harness commit, so its deletion is
# withheld (MaybeIncorrect + "commit first" note) and the tree keeps the dep.
# --allow-dirty gets past the tree-level gate; the per-file gate cannot be
# bypassed.
args = ["--allow-dirty"]

[[append_after_commit]]
path = "crates/alpha/Cargo.toml"
text = "\n# a local, uncommitted edit\n"
