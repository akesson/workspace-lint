[package]
name = "workspace-lint"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
repository = "https://github.com/akesson/workspace-lint"

[dependencies]
anstream = { workspace = true }
anstyle = { workspace = true }
clap = { workspace = true }
fs-err = { workspace = true }
globset = { workspace = true }
ignore = { workspace = true }
proc-macro2 = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
# `dump-ir --json` re-serializes a decoded fragment for jq-able debug output.
serde_json = { workspace = true }
strip-ansi-escapes = { workspace = true }
syn = { workspace = true }
toml = { workspace = true }
wl-diagnostic = { path = "../wl-diagnostic" }
wl-engine = { path = "../wl-engine" }
wl-lint-api = { path = "../wl-lint-api" }
wl-lints = { path = "../wl-lints" }

[dev-dependencies]
assert_cmd = { workspace = true }
cargo-husky = { workspace = true }
insta = { workspace = true }
predicates = { workspace = true }
tempfile = { workspace = true }
toml = { workspace = true }
