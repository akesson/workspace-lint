# workspace-lint: expect(crate-size) — transitionally over the line while the
# crate carries BOTH unused-pub backends (lints/unused_pub/legacy.rs) plus the
# deep/ SCIP verifier; the migration's deletion PR removes them and this
# expect rots loudly via stale-expect.
[package]
name = "workspace-lint"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
repository = "https://github.com/akesson/workspace-lint"

[dependencies]
clap = { workspace = true }
fs-err = { workspace = true }
globset = { workspace = true }
ignore = { workspace = true }
proc-macro2 = { workspace = true }
# scip + protobuf: decode a `rust-analyzer scip` index for `--fix`'s deep
# verification (see src/deep/). Binary-only — kept off the published crates.
protobuf = { workspace = true }
regex = { workspace = true }
scip = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
shell-words = { workspace = true }
strip-ansi-escapes = { workspace = true }
syn = { workspace = true }
syn-workspace = { path = "../syn-workspace" }
tokei = { workspace = true }
toml = { workspace = true }
wl-engine = { path = "../wl-engine" }

[dev-dependencies]
assert_cmd = { workspace = true }
cargo-husky = { workspace = true }
insta = { workspace = true }
predicates = { workspace = true }
tempfile = { workspace = true }
toml = { workspace = true }
