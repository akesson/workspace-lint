[package]
name = "workspace-lint"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
repository = "https://github.com/human-solutions/workspace-lint"

[dependencies]
clap = { workspace = true }
fs-err = { workspace = true }
globset = { workspace = true }
ignore = { workspace = true }
proc-macro2 = { workspace = true }
# scip + protobuf: decode a `rust-analyzer scip` index for `--fix`'s deep
# verification (see src/deep/). Binary-only — kept off the published crates.
protobuf = { workspace = true }
regex = { workspace = true }
rustfix = { workspace = true }
scip = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
shell-words = { workspace = true }
strip-ansi-escapes = { workspace = true }
syn = { workspace = true }
syn-workspace = { path = "../syn-workspace" }
tokei = { workspace = true }
toml = { workspace = true }
# Zero-dep marker crate; needed at non-test config so the `expect!` macros
# inside `src/` resolve. The macros expand to nothing, so no runtime cost.
workspace-lint-marker = { path = "../workspace-lint-marker" }

[dev-dependencies]
assert_cmd = { workspace = true }
cargo-husky = { workspace = true }
insta = { workspace = true }
predicates = { workspace = true }
tempfile = { workspace = true }
toml = { workspace = true }
